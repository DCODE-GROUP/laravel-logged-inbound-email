name: phpstan

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "**.php"
      - "phpstan.neon"
      - ".github/workflows/phpstan.yml"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: phpstan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpstan:
    name: phpstan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPStan
        run: composer analyse -- --error-format=github
