name: code-style

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "**.php"
      - ".github/workflows/code-style.yml"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: code-style-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Pint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Pint (style)
        run: composer lint
